# MedPreços - ambiente completo (o mesmo desenho da produção 24x7):
#
#   docker compose up -d --build        sobe tudo; site + API em http://localhost:8731
#   docker compose logs -f api worker   acompanha
#   docker compose down                 para (os dados ficam nos volumes)
#
# Na primeira subida, o serviço "preparar" cria as tabelas e faz a carga
# inicial (baixa a lista CMED do mês, ~1-2 min; importa preços legados se
# houver em backend/dados/legado). As próximas subidas pulam a carga.
name: medprecos

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: medprecos-backend:dev
  env_file:
    - path: .env
      required: false
    # Segredos do backend (ex.: LOMADEE_API_KEY). DATABASE_URL/REDIS_URL abaixo têm prioridade.
    - path: backend/.env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://medprecos:${POSTGRES_PASSWORD:-medprecos-dev}@db:5432/medprecos
    REDIS_URL: redis://redis:6379/0
    DADOS_DIR: /dados
  volumes:
    - dados:/dados
    # Preços já raspados pelos scripts antigos (só leitura, usados na carga inicial)
    - ./backend/dados/legado:/dados/legado:ro
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medprecos
      POSTGRES_USER: medprecos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medprecos-dev}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medprecos -d medprecos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Sem "ports": o banco só é acessível pelos outros serviços (rede interna)

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  preparar:
    <<: *backend
    command: ["sh", "-c", "python -m app.cli migrar && python -m app.cli carga-inicial"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${MEDPRECOS_PORTA:-8731}:8000"
    depends_on:
      preparar: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info", "--concurrency", "2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    depends_on:
      preparar: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  agenda:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info", "-s", "/dados/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      preparar: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  postgres:
  redis:
  dados:
